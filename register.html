<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/logo_black.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Merienda:wght@300..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <script src="javascript/notification.js"></script>
    <script src="javascript/api.js"></script>
    <script src="javascript/main.js"></script>
    <title>Register</title>
  </head>
  <body>
    <header>
      <nav id="navbar" class="navbar">
        <div id="navbar-button-container">
          <button id="menu-button" onclick="toggleNav(event)">Menu</button>
          <div>
            <img src="images/logo_black.png" width="32" height="32" alt="Vision Logo" />
          </div>
          <div aria-roledescription="title" class="title">Vision</div>
        </div>

        <ul id="nav-list" class="hidden">
          <li><a href="index.html">All Posts</a></li>
          <li><a href="create_post.html">New Post</a></li>
          <li><a href="bookmarked_posts.html">Saved Posts</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
    </header>
    <main>
        <h1 class="centered-text">Create an Account on Vision</h1>
      <form id="register-form" method="post" onsubmit="handleRegistration(event)">
        <label for="email">Email Address</label>
        <input id="email-address" minlength="4" type="email" name="email-address" placeholder="john@crymail.com" required />
        <label for="username">Username</label>
        <input id="username" minlength="4" type="text" name="username" placeholder="Username" required />
        <label for="password">Password</label>
        <input id="password" minlength="4" type="password" name="password" placeholder="password" required />
        <input type="submit" />
      </form>
      <p class="centered-text">Or <a href="login.html">Login</a> if you already have an account</p>
      <div id="notification"></div>
    </main>
    <footer class="flex-grow">
      <div class="flex items-center">
        <div>
          <img src="images/logo_white.png" width="48" height="48" alt="Vision Logo" />
        </div>
        <h2 class="small-padding">Vision</h2>
      </div>
      <section>
        <ul id="footer-nav-list">
          <li><a href="index.html">All Posts</a></li>
          <li><a href="create_post.html">New Post</a></li>
          <li><a href="bookmarked_posts.html">Saved Posts</a></li>
          <li><a href="register.html">Register</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </section>

      <span id="copyright-note">All Rights Reserved. Site</span>
    </footer>
  </body>
</html>
